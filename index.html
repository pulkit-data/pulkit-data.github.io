<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulkit | Data Analyst Portfolio</title>
<style>
:root{--bg:#0b1020;--card:#131a30;--line:#222c4a;--text:#e8ecf8;--mute:#9aa6c6;--a:#6ee7b7;--b:#60a5fa;--c:#a78bfa}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
a{color:var(--b);text-decoration:none}a:hover{text-decoration:underline}
.progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--a),var(--b),var(--c));z-index:50;width:0}
nav{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:14px 6vw;backdrop-filter:blur(12px);background:rgba(11,16,32,.7);border-bottom:1px solid var(--line)}
nav b{letter-spacing:.5px}nav div a{color:var(--mute);margin-left:22px;font-size:.92rem}nav div a:hover{color:var(--text);text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:0 22px}
.hero{position:relative;padding:90px 0 70px;min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.bars{position:absolute;right:0;bottom:30px;display:flex;align-items:flex-end;gap:8px;height:180px;opacity:.55;z-index:0}
.bars i{width:14px;border-radius:6px 6px 0 0;background:linear-gradient(var(--b),var(--c));animation:bar 3.2s ease-in-out infinite alternate}
@keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.bars i{transform-origin:bottom}
.hero>*:not(.bars){position:relative;z-index:1}
.tag{display:inline-block;padding:5px 14px;border:1px solid var(--line);border-radius:99px;color:var(--a);font-size:.85rem;width:fit-content;background:rgba(110,231,183,.07)}
h1{font-size:clamp(2.8rem,8vw,5.2rem);margin:18px 0 6px;line-height:1.05;background:linear-gradient(120deg,#fff,var(--b) 50%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.role{font-size:clamp(1.1rem,3vw,1.6rem);color:var(--mute);min-height:2em}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--a);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.lead{max-width:560px;color:var(--mute)}
.btns{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:10px;font-weight:600;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-3px);text-decoration:none}
.btn.p{background:linear-gradient(120deg,var(--a),var(--b));color:#06101f;box-shadow:0 8px 24px rgba(96,165,250,.25)}
.btn.s{border:1px solid var(--line);color:var(--text)}
h2{font-size:1.8rem;margin:80px 0 24px}
h2 span{color:var(--a);font-size:.9rem;display:block;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.reveal{opacity:0;transform:translateY(32px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-4px);border-color:#34406a;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:22px 0}
.stat{background:#0f1730;border:1px solid var(--line);border-radius:14px;padding:18px}
.stat small{color:var(--mute)}.stat strong{display:block;font-size:1.9rem;color:var(--a)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:760px){.split{grid-template-columns:1fr}.bars{display:none}nav div a{margin-left:12px}}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .fg{transition:stroke-dashoffset 1.8s cubic-bezier(.2,.8,.2,1)}
h3{margin:0 0 8px;font-size:1.3rem}h4{margin:18px 0 8px;color:var(--mute);font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase}
ul.ins{list-style:none;padding:0;margin:0}
ul.ins li{padding:9px 0 9px 28px;position:relative;border-bottom:1px dashed var(--line);opacity:0;transform:translateX(-14px);transition:all .5s ease}
ul.ins.in li{opacity:1;transform:none}
ul.ins li:before{content:"";position:absolute;left:4px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--a);box-shadow:0 0 0 4px rgba(110,231,183,.15)}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:.92rem;opacity:0;transform:scale(.85);transition:all .45s cubic-bezier(.3,1.5,.5,1)}
.pill:hover{border-color:var(--b);color:var(--b)}
.pills.in .pill{opacity:1;transform:none}
.tools{margin-top:18px;color:var(--mute);font-size:.9rem}
.tools b{color:var(--b)}
footer{text-align:center;color:var(--mute);padding:60px 0 40px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal,.pill,ul.ins li{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const h = React.createElement;
const { useState, useEffect, useRef } = React;

function useInView(once = true) {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el || !("IntersectionObserver" in window)) { setSeen(true); return; }
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setSeen(true); if (once) io.disconnect(); }
    }, { threshold: 0.2 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return [ref, seen];
}

function Reveal({ children, delay = 0, className = "" }) {
  const [ref, seen] = useInView();
  return h("div", { ref, className: "reveal " + (seen ? "in " : "") + className, style: { transitionDelay: delay + "ms" } }, children);
}

function CountUp({ to, decimals = 0, prefix = "", suffix = "", duration = 1800 }) {
  const [ref, seen] = useInView();
  const [v, setV] = useState(0);
  useEffect(() => {
    if (!seen) return;
    let raf, t0;
    const step = (t) => {
      if (!t0) t0 = t;
      const p = Math.min((t - t0) / duration, 1);
      setV(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [seen]);
  const text = v.toLocaleString("en-IN", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return h("span", { ref }, prefix + text + suffix);
}

function Typing({ words }) {
  const [i, setI] = useState(0);
  const [n, setN] = useState(0);
  const [del, setDel] = useState(false);
  useEffect(() => {
    const w = words[i];
    let delay = del ? 35 : 75;
    if (!del && n === w.length) delay = 1400;
    if (del && n === 0) delay = 300;
    const t = setTimeout(() => {
      if (!del && n === w.length) setDel(true);
      else if (del && n === 0) { setDel(false); setI((i + 1) % words.length); }
      else setN(n + (del ? -1 : 1));
    }, delay);
    return () => clearTimeout(t);
  }, [n, del, i]);
  return h("div", { className: "role" }, "I work with ", h("span", { style: { color: "#6ee7b7" } }, words[i].slice(0, n)), h("span", { className: "caret" }));
}

function Ring({ value }) {
  const [ref, seen] = useInView();
  const r = 52, c = 2 * Math.PI * r;
  return h("div", { className: "ring", ref },
    h("svg", { width: 130, height: 130, viewBox: "0 0 130 130" },
      h("defs", null, h("linearGradient", { id: "g", x1: "0", y1: "0", x2: "1", y2: "1" },
        h("stop", { offset: "0", stopColor: "#6ee7b7" }), h("stop", { offset: "1", stopColor: "#60a5fa" }))),
      h("circle", { cx: 65, cy: 65, r, stroke: "#222c4a" }),
      h("circle", { className: "fg", cx: 65, cy: 65, r, stroke: "url(#g)", strokeDasharray: c, strokeDashoffset: seen ? c * (1 - value / 100) : c })),
    h("div", null, h("strong", { style: { fontSize: "2rem", color: "#6ee7b7" } }, h(CountUp, { to: value, decimals: 2, suffix: "%" })),
      h("div", { style: { color: "#9aa6c6", fontSize: ".9rem" } }, "Average profit margin")));
}

function Insights({ items }) {
  const [ref, seen] = useInView();
  return h("ul", { className: "ins " + (seen ? "in" : ""), ref },
    items.map((t, i) => h("li", { key: i, style: { transitionDelay: i * 90 + "ms" } }, t)));
}

function Pills({ items }) {
  const [ref, seen] = useInView();
  return h("div", { className: "pills " + (seen ? "in" : ""), ref },
    items.map((t, i) => h("span", { key: t, className: "pill", style: { transitionDelay: i * 70 + "ms" } }, t)));
}

function ScrollBar() {
  const ref = useRef(null);
  useEffect(() => {
    const f = () => {
      const d = document.documentElement;
      ref.current.style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight || 1)) * 100 + "%";
    };
    window.addEventListener("scroll", f, { passive: true });
    return () => window.removeEventListener("scroll", f);
  }, []);
  return h("div", { className: "progress", ref });
}

const results = [
  "South region and Consumer segment drove the highest revenue",
  "Mobile App was the top sales channel",
  "Organic Search performed best among marketing channels",
  "Almost all revenue came from Repeat customers",
  "High discounts significantly reduced profit margins",
];
const recs = [
  "Focus on new customer acquisition",
  "Invest more in Mobile App & Website",
  "Scale Organic Search and Google Ads",
  "Optimize discount strategy to protect margins",
];
const skills = ["SQL", "Python (Pandas)", "Excel", "Power BI", "Tableau", "Data Cleaning", "Exploratory Data Analysis", "Business Insights", "Data Visualization"];
const heights = [40, 65, 50, 85, 60, 100, 75, 90, 55, 70];

function App() {
  return h(React.Fragment, null,
    h(ScrollBar),
    h("nav", null, h("b", null, "Pulkit"),
      h("div", null, h("a", { href: "#project" }, "Project"), h("a", { href: "#skills" }, "Skills"), h("a", { href: "#contact" }, "Contact"))),
    h("main", null,
      h("section", { className: "hero" },
        h("div", { className: "bars", "aria-hidden": "true" },
          heights.map((x, i) => h("i", { key: i, style: { height: x + "%", animationDelay: i * 0.25 + "s", animationDuration: 2.4 + (i % 4) * 0.5 + "s" } }))),
        h("span", { className: "tag" }, "Aspiring Data Analyst"),
        h("h1", null, "Pulkit"),
        h(Typing, { words: ["SQL", "Python", "Power BI", "Tableau", "Excel"] }),
        h("p", { className: "lead" }, "I turn raw data into clear business insights using SQL, Python, Excel, Power BI, and Tableau."),
        h("div", { className: "btns" },
          h("a", { className: "btn p", href: "#project" }, "View my work"),
          h("a", { className: "btn s", href: "https://github.com/pulkit-data", target: "_blank", rel: "noopener" }, "GitHub"))),

      h("section", { id: "project" },
        h(Reveal, null, h("h2", null, h("span", null, "Featured Project"), "E-Commerce Sales Analysis")),
        h(Reveal, null, h("div", { className: "card" },
          h("p", { style: { color: "#9aa6c6", marginTop: 0 } }, "End-to-end analysis of ", h("b", { style: { color: "#e8ecf8" } }, h(CountUp, { to: 138000, suffix: "+" })), " e-commerce transactions to understand revenue drivers, customer behavior, and profitability."),
          h("div", { className: "stats" },
            h("div", { className: "stat" }, h("small", null, "Total Revenue"), h("strong", null, h(CountUp, { to: 177.13, decimals: 2, prefix: "₹", suffix: " Cr" }))),
            h("div", { className: "stat" }, h("small", null, "Total Profit"), h("strong", null, h(CountUp, { to: 76.15, decimals: 2, prefix: "₹", suffix: " Cr" }))),
            h("div", { className: "stat" }, h(Ring, { value: 45.07 }))),
          h("div", { className: "split" },
            h("div", null, h("h4", null, "Key Results"), h(Insights, { items: results })),
            h("div", null, h("h4", null, "Business Recommendations"), h(Insights, { items: recs }))),
          h("p", { className: "tools" }, h("b", null, "Tools used: "), "SQL (PostgreSQL) · Python (Pandas) · Power BI")))),

      h("section", null,
        h(Reveal, null, h("h2", null, h("span", null, "More Work"), "Other Projects")),
        h(Reveal, null, h("div", { className: "card" },
          h("h3", null, "Nike Sales Analysis"),
          h("p", { style: { color: "#9aa6c6", margin: 0 } }, "Cleaned and analyzed Nike sales data. Built interactive dashboards in Excel and Tableau, and performed analysis in Python."),
          h("p", { className: "tools" }, h("b", null, "Tools: "), "Excel · Python · Tableau")))),

      h("section", { id: "skills" },
        h(Reveal, null, h("h2", null, h("span", null, "Toolkit"), "Skills")),
        h(Pills, { items: skills })),

      h("section", { id: "contact" },
        h(Reveal, null, h("h2", null, h("span", null, "Get in touch"), "Contact")),
        h(Reveal, null, h("div", { className: "card" },
          h("p", { style: { margin: 0 } }, "GitHub: ", h("a", { href: "https://github.com/pulkit-data", target: "_blank", rel: "noopener" }, "github.com/pulkit-data")),
          h("p", { style: { margin: "8px 0 0" } }, "Portfolio: ", h("a", { href: "https://pulkit-data.github.io", target: "_blank", rel: "noopener" }, "pulkit-data.github.io"))))),

      h("footer", null, "© Pulkit · Built with React")));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
